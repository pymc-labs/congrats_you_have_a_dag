[project]
name = "dags-adia-lab-workshop"
version = "0.1.0"
description = "DAG blogpost demo: Monetary Policy Surprises and Equity Returns"
authors = ["PyMC Labs"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
pymc = ">=5.10"
arviz = ">=0.17"
numpy = ">=1.26"
pandas = ">=2.1"
matplotlib = ">=3.8"
seaborn = ">=0.13"
jupyterlab = ">=4.0"
ipykernel = ">=6.28"
scipy = ">=1.12"
xarray = ">=2024.1"

[tasks]
lab = "jupyter lab"
run-demo = "python run_demo_dag1.py"
